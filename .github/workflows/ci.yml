name: CI

on:
  push:
    branches: [ main, master, test ]
  pull_request:
    branches: [ main, master, test ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Check out code
      uses: actions/checkout@v3

    - name: Get dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -race ./...
      env:
        PGCTL_DATABASE_HOST: localhost
        PGCTL_DATABASE_PORT: 5432
        PGCTL_DATABASE_USER: postgres
        PGCTL_DATABASE_PASSWORD: postgres
        PGCTL_DATABASE_NAME: postgres
        PGCTL_DATABASE_SSLMODE: disable

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Check out code
      uses: actions/checkout@v3

    - name: Get dependencies
      run: go mod download

    - name: Build binary
      run: |
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o pgctl-${{ matrix.goos }}-${{ matrix.goarch }} .
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: pgctl-${{ matrix.goos }}-${{ matrix.goarch }}
        path: pgctl-${{ matrix.goos }}-${{ matrix.goarch }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Check out code
      uses: actions/checkout@v3

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest